# VERITENSOR backend — Render blueprint.
#
# The FastAPI backend must run as a LONG-LIVED process: it holds the seeded
# subnet in memory, streams server-sent events, and runs simulations in worker
# threads. That rules out serverless platforms (including Vercel functions).
#
#   1. push this repository to GitHub
#   2. Render → New → Blueprint → select the repo
#   3. copy the resulting URL into Vercel as BACKEND_URL
#
services:
  - type: web
    name: veritensor-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: starter          # 512 MB is enough for the seeded network
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SIMULATION_MODE
        value: "true"
      - key: SEED_TASKS
        value: "260"
      # Lock CORS to your Vercel domain once you know it.
      - key: CORS_ORIGINS
        value: https://veritensor.vercel.app
      # Generated by Render, never committed.
      - key: ADMIN_API_KEY
        generateValue: true
      - key: VERITENSOR_COMMIT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: veritensor-db
          property: connectionString

databases:
  - name: veritensor-db
    plan: free
    databaseName: veritensor
    user: veritensor
